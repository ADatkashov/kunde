name: Leisure Android E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/leisure-native-e2e.yml'
      - 'scripts/ci/leisure_native_e2e.py'
      - 'mobile/lib/features/leisure/**'
      - 'backend/src/main/java/kz/kunde/leisure/**'
      - 'backend/src/main/java/kz/kunde/events/**'
      - 'mobile/lib/features/home/**'
      - 'backend/src/main/resources/db/migration/*leisure*.sql'
  pull_request:
    paths:
      - '.github/workflows/leisure-native-e2e.yml'
      - 'scripts/ci/leisure_native_e2e.py'
      - 'mobile/lib/features/leisure/**'
      - 'backend/src/main/java/kz/kunde/leisure/**'
      - 'backend/src/main/java/kz/kunde/events/**'
      - 'mobile/lib/features/home/**'
      - 'backend/src/main/resources/db/migration/*leisure*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leisure-native-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kunde_e2e
          POSTGRES_DB: kunde_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kunde_e2e" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/kunde_e2e
      DB_USERNAME: kunde_e2e
      KUNDE_ENVIRONMENT: test
      CONSUMER_IDENTITY_ENABLED: 'true'
      AUTH_PHONE_ENABLED: 'true'
      AUTH_DEV_OTP_ENABLED: 'true'
      AUTH_DEV_OTP_SKIP_THROTTLE: 'true'
      AUTH_DEV_OTP_ALLOWED_PHONES: '+77000000001,+77000000002,+77000000003,+77000000004,+77000000005'
      PARTNER_OPS_SEED_DEMO: 'true'
      LEISURE_ENABLED: 'true'
      EVENTS_ENABLED: 'true'
      APP_SECURITY_RATE_LIMIT_REQUESTS: '100000'
      APP_SECURITY_AUTHENTICATED_RATE_LIMIT_REQUESTS: '100000'
      GRADLE_USER_HOME: /tmp/kunde-gradle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enable Android emulator acceleration
        run: |
          mkdir -p reports/leisure-native
          echo '{"status":"NOT_EXECUTED","phase":"emulator_prerequisites","completed":[]}' > reports/leisure-native/status.json
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Package a local test backend
        working-directory: backend
        run: mvn -B -ntp -U -DskipTests package # -U: ignore cached "not found" entries left by a transient Central failure
      - name: Build the local-fixture debug Consumer APK
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          mkdir -p "$RUNNER_TEMP/leisure-apk"
          fixture_url=http://localhost:8081/api/v1/
          flutter build apk --debug --target-platform android-x64 \
            --dart-define=API_BASE_URL="$fixture_url" --dart-define=PHONE_AUTH_ENABLED=true
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/leisure-apk/consumer.apk"
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          LEISURE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        with:
          api-level: 35
          arch: x86_64
          # the plain AOSP image ("default") was tried: the app never started on it, so google_apis stays
          target: google_apis
          # the google_apis system services crash-loop under swiftshader (idmap/devicelock/GMS restarts) and the device is sometimes lost late in the run
          ram-size: 4096M
          heap-size: 576M
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: python3 scripts/ci/leisure_native_e2e.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: leisure-native-e2e
          path: reports/leisure-native/
          retention-days: 3
