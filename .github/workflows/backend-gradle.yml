name: Backend Gradle (equivalence)
# ADR-023: the Gradle build runs next to Maven until the equivalence gate passes; Maven (backend.yml) stays authoritative.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/ci/smoke_backend.py', '.github/workflows/backend-gradle.yml']
  pull_request:
    paths: ['backend/**', 'scripts/ci/smoke_backend.py', '.github/workflows/backend-gradle.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  backend-gradle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kunde
          POSTGRES_USER: kunde_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kunde_ci -d kunde"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Gradle wrapper integrity (pinned distribution checksum and wrapper jar hash)
        working-directory: backend
        run: |
          grep -q '^distributionSha256Sum=[0-9a-f]\{64\}$' gradle/wrapper/gradle-wrapper.properties
          (cd gradle/wrapper && sha256sum -c gradle-wrapper.jar.sha256)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle.kts
            backend/gradle/libs.versions.toml
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Architecture boundaries (fast, no database)
        working-directory: backend
        run: ./gradlew --no-daemon test --tests 'kz.kunde.architecture.*' --tests '*PlacementServiceTest'
      - name: Build, test and package
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kunde
          DB_USERNAME: kunde_ci
          DB_PASSWORD: synthetic_ci_only
        run: |
          ./gradlew --no-daemon build
          test -s build/libs/kunde-api-0.1.0-SNAPSHOT.jar
          jar tf build/libs/kunde-api-0.1.0-SNAPSHOT.jar | grep -q 'BOOT-INF/lib/'
      - name: Packaged JAR HTTP and fail-closed smoke
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kunde
          DB_USERNAME: kunde_ci
          DB_PASSWORD: synthetic_ci_only
        run: sed 's|backend/target/kunde-api|backend/build/libs/kunde-api|' scripts/ci/smoke_backend.py > /tmp/smoke_gradle.py && python3 /tmp/smoke_gradle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-gradle-reports
          path: backend/build/test-results/test/*.xml
          retention-days: 3
