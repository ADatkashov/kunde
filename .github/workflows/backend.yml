name: Backend CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/ci/smoke_backend.py', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'scripts/ci/smoke_backend.py', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to test (default: selected branch head)'
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kunde
          POSTGRES_USER: kunde_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kunde_ci -d kunde"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0  # detect_affected.py diffs base...head (ADR-027)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      # Gradle dependency + build cache (ADR-027). setup-gradle is already pinned in the Android workflows; PRs only read the cache,
      # main writes it. Test tasks are never cached (see backend/gradle/kunde-module.gradle.kts), so a green cache hit can not hide a test.
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Gradle wrapper integrity (pinned distribution checksum and wrapper jar hash)
        working-directory: backend
        run: |
          grep -q '^distributionSha256Sum=[0-9a-f]\{64\}$' gradle/wrapper/gradle-wrapper.properties
          (cd gradle/wrapper && sha256sum -c gradle-wrapper.jar.sha256)
      # ADR-027: scripts/ci/detect_affected.py decides what to test. Any doubt (workflow_dispatch/workflow_call without a diff,
      # unknown file, CI/Gradle change, unusable SHAs, detector error) means FULL = the previous `clean build`. This runs as a
      # step, not a separate job, so the required check `Backend CI / backend` always exists and is never "skipped".
      - name: Detect affected modules
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) set -- --base "$PR_BASE" --head "$PR_HEAD" --merge-base ;;
            push) set -- --base "$PUSH_BEFORE" --head "$PUSH_HEAD" ;;
            *) set -- ;;
          esac
          python3 scripts/ci/detect_affected.py "$@" --summary --result-file "$RUNNER_TEMP/affected.json"
          python3 scripts/ci/backend_gradle_args.py "$RUNNER_TEMP/affected.json" > "$RUNNER_TEMP/selection.txt"
          mapfile -t OUT < "$RUNNER_TEMP/selection.txt"
          test -n "${OUT[0]}"
          echo "mode=${OUT[0]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${OUT[@]:1}" > "$RUNNER_TEMP/gradle-args.txt"
          echo "Backend mode: ${OUT[0]}; Gradle args: ${OUT[*]:1}"
      - name: Architecture boundaries (fast, no database)
        if: steps.affected.outputs.mode != 'skip'
        working-directory: backend
        run: ./gradlew --no-daemon -q test --tests 'kz.kunde.architecture.*' --tests '*PlacementServiceTest'
      - name: Verify and package
        if: steps.affected.outputs.mode != 'skip'
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kunde
          DB_USERNAME: kunde_ci
          DB_PASSWORD: synthetic_ci_only
        run: |
          mapfile -t ARGS < "$RUNNER_TEMP/gradle-args.txt"
          ./gradlew --no-daemon "${ARGS[@]}"
          # Selective runs assemble every module; full runs build (which includes assemble).
          test -s build/libs/kunde-api-0.1.0-SNAPSHOT.jar
          jar tf build/libs/kunde-api-0.1.0-SNAPSHOT.jar > build/jar-contents.txt
          grep -q 'BOOT-INF/lib/' build/jar-contents.txt
      - name: Packaged JAR HTTP and fail-closed smoke
        if: steps.affected.outputs.mode != 'skip'
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kunde
          DB_USERNAME: kunde_ci
          DB_PASSWORD: synthetic_ci_only
        run: python3 scripts/ci/smoke_backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-reports
          path: |
            backend/*/build/test-results/test/*.xml
            reports/backend-smoke.json
          retention-days: 3
  # Render builds backend/Dockerfile (DEV), but until ADR-023 nothing in CI ever built it: a broken COPY/jar path would only show up
  # at deploy time. Build only (no push, no secrets); runs in parallel with the test job.
  docker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Build backend image (Dockerfile as deployed to Render)
        run: docker build --pull=false -t kunde-api:ci backend
      - name: Image contract (non-root user, jar present)
        run: |
          test "$(docker image inspect kunde-api:ci --format '{{.Config.User}}')" = "10001:10001"
          docker create --name probe kunde-api:ci >/dev/null
          docker cp probe:/app/app.jar /tmp/app.jar
          test -s /tmp/app.jar
