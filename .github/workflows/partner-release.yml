name: Partner Android Release APK (DEV)
on:
  workflow_dispatch:
    inputs:
      api-base-url:
        description: 'HTTPS DEV API base URL'
        required: true
        default: 'https://kunde-backend-ty81.onrender.com/api/v1/'
permissions:
  contents: read
jobs:
  partner-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api-base-url }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KUNDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KUNDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KUNDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KUNDE_KEYSTORE_PASSWORD KUNDE_KEY_ALIAS KUNDE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret: $v"; exit 1; fi
          done
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::HTTPS API required"; exit 1;; esac
          case "$API_BASE_URL" in *localhost*|*127.0.0.1*|*10.0.2.2*) exit 1;; esac
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Create isolated Partner Android platform
        working-directory: partner_app
        run: |
          flutter create --platforms=android --org com.kunde --project-name kunde_partner .
          rm -f test/widget_test.dart
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Configure signed release
        working-directory: partner_app
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/partner-release.jks"
          export KUNDE_KEYSTORE_PATH="$RUNNER_TEMP/partner-release.jks"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s='import java.util.Properties\n'+s
          s=s.replace('android {', '''val signingProps = Properties().apply {
              setProperty("storeFile", System.getenv("KUNDE_KEYSTORE_PATH") ?: "")
              setProperty("storePassword", System.getenv("KUNDE_KEYSTORE_PASSWORD") ?: "")
              setProperty("keyAlias", System.getenv("KUNDE_KEY_ALIAS") ?: "")
              setProperty("keyPassword", System.getenv("KUNDE_KEY_PASSWORD") ?: "")
          }
          android {''',1)
          s=s.replace('    buildTypes {','''    signingConfigs {
              create("partnerRelease") {
                  storeFile = file(signingProps.getProperty("storeFile"))
                  storePassword = signingProps.getProperty("storePassword")
                  keyAlias = signingProps.getProperty("keyAlias")
                  keyPassword = signingProps.getProperty("keyPassword")
              }
          }
              buildTypes {''',1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")',
                      'signingConfig = signingConfigs.getByName("partnerRelease")')
          p.write_text(s)
          PY
          echo "KUNDE_KEYSTORE_PATH=$KUNDE_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed Partner release APK
        working-directory: partner_app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Verify signature and application identity
        shell: bash
        run: |
          set -euo pipefail
          apk=partner_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/partner-signing.txt"
          grep -Eq 'Verified using v[23] scheme.*true' "$RUNNER_TEMP/partner-signing.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/partner-signing.txt"; then exit 1; fi
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/partner-badging.txt"
          grep -q "package: name='com.kunde.kunde_partner'" "$RUNNER_TEMP/partner-badging.txt"
          rm -f "$RUNNER_TEMP/partner-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KUNDE-Partner-DEV-release-APK
          path: partner_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
