name: Partner Android Release APK (DEV)
on:
  workflow_dispatch:
    inputs:
      api-base-url:
        description: 'API base URL baked into the APK (https, ends with /)'
        default: 'https://kunde-backend-ty81.onrender.com/api/v1/'
      dev-otp-hint:
        description: 'Show the DEV test code hint on the OTP screen. DEV builds only; never for a store release.'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  partner-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api-base-url || 'https://kunde-backend-ty81.onrender.com/api/v1/' }}
      DEV_OTP_HINT: ${{ inputs.dev-otp-hint && 'true' || 'false' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KUNDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KUNDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KUNDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require signing secrets and an HTTPS API URL
        shell: bash
        run: |
          miss=0
          for v in KEYSTORE_B64 KUNDE_KEYSTORE_PASSWORD KUNDE_KEY_ALIAS KUNDE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::missing secret for $v (see docs/infrastructure/android-release-apk.md)"; miss=1; }
          done
          [ "$miss" = 0 ] || exit 1
          case "$API_BASE_URL" in https://*/) ;; *) echo "::error::API URL must be https and end with /"; exit 1;; esac
          case "$API_BASE_URL" in *localhost*|*10.0.2.2*|*127.0.0.1*) echo "::error::local API URL"; exit 1;; esac
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - name: Analyze and test
        working-directory: partner_app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Build signed release APK (arm64)
        working-directory: partner_app
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/partner-release.jks"
          export KUNDE_KEYSTORE_PATH="$RUNNER_TEMP/partner-release.jks"
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_TIMEOUT_SECONDS=90 \
            --dart-define=DEV_OTP_HINT="$DEV_OTP_HINT"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/KUNDE-Partner-dev-release.apk
          rm -f "$RUNNER_TEMP/partner-release.jks"
      - name: Verify signature and package identity
        run: |
          apk=dist/KUNDE-Partner-dev-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -s "$apk"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee dist/signing.txt
          grep -q "Verified using v2 scheme.*true\|Verified using v3 scheme.*true" dist/signing.txt
          if grep -qi "Android Debug" dist/signing.txt; then echo "::error::debug certificate"; exit 1; fi
          "$bt/aapt" dump badging "$apk" > dist/badging.txt
          grep -q "package: name='com.kunde.kunde_partner'" dist/badging.txt
          grep -q "application-label:'KUNDE Partner'" dist/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" dist/badging.txt
          if grep -q "package: name='com.example.kunde_mobile'" dist/badging.txt; then echo "::error::Consumer package id"; exit 1; fi
          if grep -q "application-debuggable" dist/badging.txt; then echo "::error::debuggable"; exit 1; fi
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libapp.so"
          mkdir x && unzip -q "$apk" -d x
          api_host="$(printf '%s' "$API_BASE_URL" | sed -E 's#^https://([^/:]+).*#\1#')"
          strings -a x/lib/arm64-v8a/libapp.so | grep -qF "$api_host" || { echo "::error::API URL not in APK"; exit 1; }
          strings -a x/lib/arm64-v8a/libapp.so | grep -q "auth/otp/verify" || { echo "::error::OTP sign-in is not compiled in"; exit 1; }
          if grep -rqaE "localhost:8080|10\.0\.2\.2" x/lib x/assets 2>/dev/null; then echo "::error::local URL in APK"; exit 1; fi
          if grep -rqaE "BEGIN (RSA |EC )?PRIVATE KEY|client_secret" x/lib x/assets 2>/dev/null; then echo "::error::secret marker in APK"; exit 1; fi
          (cd dist && sha256sum KUNDE-Partner-dev-release.apk | tee KUNDE-Partner-dev-release.apk.sha256)
          git rev-parse HEAD > dist/commit.txt
          head -n 1 dist/badging.txt > dist/version.txt
          ls -l "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KUNDE-Partner-dev-release
          path: |
            dist/KUNDE-Partner-dev-release.apk
            dist/KUNDE-Partner-dev-release.apk.sha256
            dist/signing.txt
            dist/commit.txt
            dist/version.txt
          retention-days: 14
          if-no-files-found: error
