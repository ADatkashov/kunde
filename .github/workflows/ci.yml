name: CI configuration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Syntax and whitespace
        run: |
          git diff --check HEAD^ HEAD
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'PY'
          import ast, pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.load(p.read_text(), Loader=yaml.BaseLoader)
              assert 'on' in data and 'jobs' in data, p
          for p in pathlib.Path('scripts/ci').glob('*.py'):
              ast.parse(p.read_text())
          PY
      - name: Flyway version uniqueness on the merge tree
        run: |
          python3 - <<'PY'
          import pathlib, re
          from collections import defaultdict

          versions = defaultdict(list)
          migrations = sorted(pathlib.Path('backend/app/src/main/resources/db/migration').glob('V*__*.sql'))
          if not migrations:
              raise SystemExit('No Flyway migrations found: the check would pass vacuously')
          for path in migrations:
              version = path.name.split('__', 1)[0][1:]
              parts = [int(part) for part in re.split(r'[._]', version)]
              while len(parts) > 1 and parts[-1] == 0:
                  parts.pop()
              versions[tuple(parts)].append(path.name)
          duplicates = [', '.join(sorted(names)) for names in versions.values() if len(names) > 1]
          if duplicates:
              raise SystemExit('Duplicate Flyway versions: ' + '; '.join(sorted(duplicates)))
          PY
      - name: CI gate regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Backlog files parse and canonical tasks are consistent
        run: python3 scripts/ci/check_backlog.py
      - name: Secret markers in repository tree
        run: python3 scripts/ci/check_secrets.py
