name: CI configuration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Syntax and whitespace
        run: |
          git diff --check HEAD^ HEAD
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'PY'
          import ast, pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.load(p.read_text(), Loader=yaml.BaseLoader)
              assert 'on' in data and 'jobs' in data, p
          for p in pathlib.Path('scripts/ci').glob('*.py'):
              ast.parse(p.read_text())
          PY
      - name: CI gate regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Secret markers in repository tree
        run: python3 scripts/ci/check_secrets.py
