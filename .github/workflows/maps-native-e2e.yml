name: Taxi with KUNDE Maps Android E2E
on:
  # HEAVY CHECK: manual / reusable only. It is intentionally NOT triggered by pull_request or push, so it never blocks
  # merge or the signed APK. See docs/engineering-foundation/ci-cd-fast-merge.md.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to test (default: the branch selected for the run)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: maps-native-e2e-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kunde_e2e
          POSTGRES_DB: kunde_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kunde_e2e" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/kunde_e2e
      DB_USERNAME: kunde_e2e
      KUNDE_ENVIRONMENT: test
      CONSUMER_IDENTITY_ENABLED: 'true'
      AUTH_PHONE_ENABLED: 'true'
      AUTH_DEV_OTP_ENABLED: 'true'
      AUTH_DEV_OTP_SKIP_THROTTLE: 'true'
      AUTH_DEV_OTP_ALLOWED_PHONES: '+77000000001,+77000000002'
      RIDES_ENABLED: 'true'
      RIDES_CONSUMER_ENABLED: 'true'
      RIDES_EXECUTOR_ENABLED: 'true'
      RIDES_DISPATCH_ENABLED: 'true'
      RIDES_SYNTHETIC_ROUTING_ENABLED: 'false'
      RIDES_PAYMENTS_ENABLED: 'false'
      GRADLE_USER_HOME: /tmp/kunde-gradle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Enable Android emulator acceleration
        run: |
          mkdir -p reports/maps-native
          echo '{"status":"NOT_EXECUTED","phase":"emulator_prerequisites","completed":[]}' > reports/maps-native/status.json
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Package a local test backend
        working-directory: backend
        run: ./gradlew --no-daemon -q bootJar
      - name: Build the two local-fixture debug APKs
        working-directory: apps/consumer
        run: |
          flutter pub get --enforce-lockfile
          mkdir -p "$RUNNER_TEMP/rides-apk"
          fixture_url=http://localhost:8081/api/v1/
          flutter build apk --debug --target-platform android-x64 \
            --dart-define=API_BASE_URL="$fixture_url" --dart-define=PHONE_AUTH_ENABLED=true
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/rides-apk/consumer.apk"
          (cd ../executor && flutter pub get --enforce-lockfile && flutter build apk --debug --target-platform android-x64 \
            --dart-define=API_BASE_URL="$fixture_url" && cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/rides-apk/executor.apk")
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          RIDES_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: python3 scripts/ci/maps_native_e2e.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maps-native-e2e
          path: reports/maps-native/
          retention-days: 3
