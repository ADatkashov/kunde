name: Security CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - name: Resolve actual graphs and plugin management
        run: |
          mkdir -p reports
          cd backend
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=../reports/maven.json
          mvn -B -ntp org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom -Doutput=../reports/effective-pom.xml
          cd ../mobile
          flutter pub get --enforce-lockfile
          flutter pub deps --json > ../reports/pub.json
      - name: OSV graph and declared build-root audits (retain both exit codes)
        run: |
          set +e
          python3 scripts/ci/osv_audit.py --maven reports/maven.json --pub reports/pub.json --python-requirements scripts/ci/native-e2e-requirements.txt --output reports/dependencies-osv.json
          dependencies_code=$?
          python3 scripts/ci/osv_audit.py --effective reports/effective-pom.xml --settings mobile/android/settings.gradle.kts --output reports/build-roots-osv.json
          roots_code=$?
          printf '{"dependencies":%s,"buildRoots":%s}\n' "$dependencies_code" "$roots_code" > reports/osv-exit-codes.json
          if [ "$dependencies_code" -eq 2 ] || [ "$roots_code" -eq 2 ]; then exit 2; fi
          if [ "$dependencies_code" -ne 0 ] || [ "$roots_code" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audits
          path: reports/
          retention-days: 3
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checksum-verified Gitleaks 8.30.1, history and working tree
        run: |
          mkdir -p reports /tmp/kunde-gitleaks
          cd /tmp/kunde-gitleaks
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' gitleaks_8.30.1_checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/kunde-gitleaks/gitleaks version > reports/gitleaks-version.txt
          /tmp/kunde-gitleaks/gitleaks git --redact=100 --report-format json --report-path reports/secrets.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secret-audit-redacted
          path: reports/
          retention-days: 1
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measured scanner capacity
        run: python3 scripts/ci/runner_resources.py --minimum-free-gib 4 --output reports/container-capacity.json
      - name: Resolve immutable linux-amd64 manifests
        run: python3 scripts/ci/resolve_images.py
      - name: Checksum-verified Trivy 0.76.2
        run: |
          mkdir -p /tmp/kunde-trivy
          cd /tmp/kunde-trivy
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_checksums.txt
          awk '$2 == "trivy_0.76.2_Linux-64bit.tar.gz"' trivy_0.76.2_checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
      - name: OS scans with genuine per-image exit codes
        run: |
          runtime_ref=$(python3 -c "import json; print(json.load(open('reports/images.json'))['images'][0]['reference'])")
          build_ref=$(python3 -c "import json; print(json.load(open('reports/images.json'))['images'][1]['reference'])")
          set +e
          /tmp/kunde-trivy/trivy image --image-src remote --scanners vuln --pkg-types os --skip-java-db-update --cache-dir /tmp/kunde-trivy-db --timeout 6m --format json --output reports/runtime-os.json --exit-code 10 "$runtime_ref"
          runtime_code=$?
          /tmp/kunde-trivy/trivy image --image-src remote --scanners vuln --pkg-types os --skip-java-db-update --cache-dir /tmp/kunde-trivy-db --timeout 6m --format json --output reports/build-os.json --exit-code 10 "$build_ref"
          build_code=$?
          /tmp/kunde-trivy/trivy --cache-dir /tmp/kunde-trivy-db --version > reports/trivy-database.txt
          printf '{"runtime":%s,"build":%s,"findingExit":10}\n' "$runtime_code" "$build_code" > reports/trivy-exits.json
          python3 - <<'PY'
          import collections, json, pathlib
          print(pathlib.Path('reports/trivy-database.txt').read_text())
          print(pathlib.Path('reports/trivy-exits.json').read_text())
          for name in ['runtime','build']:
              p=pathlib.Path('reports/'+name+'-os.json')
              if not p.exists(): continue
              data=json.loads(p.read_text())
              vulns=[v for result in data.get('Results',[]) for v in result.get('Vulnerabilities',[])]
              print('IMAGE_REPORT',name,'DIGESTS',data.get('Metadata',{}).get('RepoDigests',[]),'SEVERITIES',dict(collections.Counter(v['Severity'] for v in vulns)))
              for v in vulns:
                  if v['Severity'] in ['CRITICAL','HIGH']:
                      print('ACTIONABLE',name,v['VulnerabilityID'],v['PkgName'],v['InstalledVersion'],'fixed='+v.get('FixedVersion','UNAVAILABLE'),v['Severity'])
          PY
          if [ "$runtime_code" -ne 0 ] && [ "$runtime_code" -ne 10 ]; then exit 2; fi
          if [ "$build_code" -ne 0 ] && [ "$build_code" -ne 10 ]; then exit 2; fi
          if [ "$runtime_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-audits
          path: reports/
          retention-days: 3
  sdk-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_USER_HOME: /tmp/kunde-sdk-audit
      KUNDE_SDK_GRAPH: ${{ github.workspace }}/reports/sdk-resolved.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Resolve unmodified upstream SDK compile/runtime/buildscript graphs
        run: gradle -p "$FLUTTER_ROOT/packages/flutter_tools/gradle" --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g' -I "$GITHUB_WORKSPACE/scripts/ci/sdk_graph.init.gradle" kundeSdkGraph
      - name: Audit SDK tooling independently (no source patch or suppression)
        run: python3 scripts/ci/osv_audit.py --maven reports/sdk-resolved.json --output reports/sdk-osv.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flutter-sdk-tooling-audit
          path: reports/
          retention-days: 3
