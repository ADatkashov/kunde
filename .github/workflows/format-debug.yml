name: Temporary Dart formatting diagnostic
on:
  push:
    branches: [feat/ada-74-flutter-consents]
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Print formatted source
        working-directory: mobile
        run: |
          dart format --output=show lib/features/identity/auth_repository.dart
          dart format --output=show lib/features/identity/consent_panel.dart
          dart format --output=show test/features/identity/consent_repository_test.dart
