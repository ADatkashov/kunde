name: Android Release APK (DEV)
on:
  workflow_call:
    inputs:
      executor:
        type: boolean
        default: false
      admin:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      api-base-url:
        type: string
        default: 'https://kunde-backend-ty81.onrender.com/api/v1/'
      dev-otp-hint:
        type: boolean
        default: true
      partner-features:
        type: boolean
        default: false
      partner-apply:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to build (default: the branch selected for the run)'
        type: string
        default: ''
      executor:
        description: 'Build KUNDE Executor instead of KUNDE Consumer'
        type: boolean
        default: false
      admin:
        description: 'Build KUNDE Admin. Leave executor disabled.'
        type: boolean
        default: false
      api-base-url:
        description: 'API base URL baked into the APK'
        default: 'https://kunde-backend-ty81.onrender.com/api/v1/'
      dev-otp-hint:
        description: 'Show the DEV test code (123456) hint on the OTP screen. DEV builds only; never for a store release.'
        type: boolean
        default: true
      partner-features:
        description: 'Include the partner section (apply, offerings) in the Profile tab. DEV pilot builds for partners only; off by default.'
        type: boolean
        default: false
      partner-apply:
        description: 'Also show «Become a partner» to users who are not partner staff. Off by default: ordinary customers then see no partner section.'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      API_BASE_URL: ${{ inputs.api-base-url || 'https://kunde-backend-ty81.onrender.com/api/v1/' }}
      DEV_OTP_HINT: ${{ inputs.dev-otp-hint && 'true' || 'false' }}
      PARTNER_FEATURES: ${{ inputs.partner-features && 'true' || 'false' }}
      PARTNER_APPLY: ${{ inputs.partner-apply && 'true' || 'false' }}
      KUNDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KUNDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KUNDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KUNDE_ADMIN_BUILD: ${{ inputs.admin && 'true' || 'false' }}
      KUNDE_EXECUTOR_BUILD: ${{ inputs.executor && 'true' || 'false' }}
      APK_BASENAME: ${{ inputs.admin && 'KUNDE-admin-dev-release' || inputs.executor && 'KUNDE-executor-dev-release' || 'KUNDE-dev-release' }}
      APK_PACKAGE: ${{ inputs.admin && 'com.kunde.admin' || inputs.executor && 'com.kunde.executor' || 'com.example.kunde_mobile' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Require signing secrets and HTTPS API URL
        run: |
          if [ "$KUNDE_ADMIN_BUILD" = true ] && [ "$KUNDE_EXECUTOR_BUILD" = true ]; then
            echo "::error::Choose Admin or Executor, not both"
            exit 1
          fi
          miss=0
          for v in KEYSTORE_B64 KUNDE_KEYSTORE_PASSWORD KUNDE_KEY_ALIAS KUNDE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::missing secret for $v (see docs/infrastructure/android-release-apk.md)"; miss=1; }
          done
          [ "$miss" = 0 ] || exit 1
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::API URL must be https"; exit 1;; esac
          case "$API_BASE_URL" in *localhost*|*10.0.2.2*|*127.0.0.1*) echo "::error::local API URL"; exit 1;; esac
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build signed release APK (arm64)
        working-directory: mobile
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KUNDE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          target=lib/main.dart
          if [ "$KUNDE_EXECUTOR_BUILD" = true ]; then target=lib/executor_main.dart; fi
          if [ "$KUNDE_ADMIN_BUILD" = true ]; then target=lib/admin_rides_main.dart; fi
          flutter build apk --release --target-platform android-arm64 --target "$target" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_TIMEOUT_SECONDS=90 \
            --dart-define=PHONE_AUTH_ENABLED=true \
            --dart-define=DEV_OTP_HINT="$DEV_OTP_HINT" \
            --dart-define=PARTNER_FEATURES_ENABLED="$PARTNER_FEATURES" \
            --dart-define=PARTNER_APPLY_ENABLED="$PARTNER_APPLY"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/"$APK_BASENAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify APK
        run: |
          apk="dist/$APK_BASENAME.apk"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -s "$apk"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee dist/signing.txt
          grep -q "Verified using v2 scheme.*true\|Verified using v3 scheme.*true" dist/signing.txt
          if grep -qi "Android Debug" dist/signing.txt; then echo "::error::debug certificate"; exit 1; fi
          "$bt/aapt" dump badging "$apk" > dist/badging.txt
          grep -qF "package: name='$APK_PACKAGE'" dist/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" dist/badging.txt
          if [ "$KUNDE_EXECUTOR_BUILD" = true ]; then
            grep -q "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" dist/badging.txt
          fi
          if [ "$KUNDE_ADMIN_BUILD" = true ]; then
            grep -qF "application-label:'KUNDE Admin'" dist/badging.txt
          fi
          if grep -q "application-debuggable" dist/badging.txt; then echo "::error::debuggable"; exit 1; fi
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libapp.so"
          mkdir x && unzip -q "$apk" -d x
          api_host="$(printf '%s' "$API_BASE_URL" | sed -E 's#^https://([^/:]+).*#\1#')"
          strings -a x/lib/arm64-v8a/libapp.so | grep -qF "$api_host" || { echo "::error::API URL not in APK"; exit 1; }
          strings -a x/lib/arm64-v8a/libapp.so | grep -q "auth/otp/verify" || { echo "::error::phone authentication is not compiled in"; exit 1; }
          if grep -rqaE "localhost:8080|10\.0\.2\.2" x/lib x/assets 2>/dev/null; then echo "::error::local URL in APK"; exit 1; fi
          if grep -rqaE "BEGIN (RSA |EC )?PRIVATE KEY|client_secret" x/lib x/assets 2>/dev/null; then echo "::error::secret marker in APK"; exit 1; fi
          (cd dist && sha256sum "$APK_BASENAME.apk" | tee "$APK_BASENAME.apk.sha256")
          git rev-parse HEAD > dist/commit.txt
          head -n 1 dist/badging.txt > dist/version.txt
          ls -l "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.APK_BASENAME }}
          path: |
            dist/${{ env.APK_BASENAME }}.apk
            dist/${{ env.APK_BASENAME }}.apk.sha256
            dist/signing.txt
            dist/commit.txt
            dist/version.txt
          retention-days: 14
      - name: Build summary (commit, version, build number, download)
        if: success()
        run: |
          sha="$(cat dist/commit.txt)"
          version="$(sed -E "s/.*versionName='([^']*)'.*/\1/" dist/version.txt)"
          build="$(sed -E "s/.*versionCode='([^']*)'.*/\1/" dist/version.txt)"
          {
            echo "### $APK_BASENAME — signed DEV release APK"
            echo "- Commit: \`$sha\`"
            echo "- Version: \`$version\`  Build number: \`$build\`"
            echo "- Package: \`$APK_PACKAGE\`  API: \`$API_BASE_URL\`"
            echo "- Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (Artifacts → \`$APK_BASENAME\`)"
            echo "- E2E status: **NOT RUN by this workflow** — this APK is not E2E-verified. Heavy E2E run separately (docs/engineering-foundation/ci-cd-fast-merge.md)."
          } >> "$GITHUB_STEP_SUMMARY"
