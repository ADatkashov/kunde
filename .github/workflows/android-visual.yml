name: Android visual comparison
on:
  # HEAVY CHECK: manual / reusable only. It is intentionally NOT triggered by pull_request or push, so it never blocks
  # merge or the signed APK. See docs/engineering-foundation/ci-cd-fast-merge.md.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to test (default: the branch selected for the run)'
        required: false
        type: string
        default: ''
      base-sha:
        description: 'Commit to compare against (default: merge-base with origin/main)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      base-sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-visual-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kunde_visual
          POSTGRES_DB: kunde_visual
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kunde_visual" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/kunde_visual
      DB_USERNAME: kunde_visual
      KUNDE_ENVIRONMENT: test
      CONSUMER_IDENTITY_ENABLED: 'true'
      AUTH_PHONE_ENABLED: 'true'
      AUTH_DEV_OTP_ENABLED: 'true'
      AUTH_DEV_OTP_SKIP_THROTTLE: 'true'
      AUTH_DEV_OTP_ALLOWED_PHONES: '+77000000001'
      FOOD_ENABLED: 'true'
      FOOD_SEED_DEMO: 'true'
      BOOKING_ENABLED: 'true'
      BOOKING_SEED_DEMO: 'true'
      BEAUTY_ENABLED: 'true'
      BEAUTY_SEED_DEMO: 'true'
      BASE_SHA: ${{ inputs.base-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Enable Android emulator acceleration
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - name: Package isolated visual backend
        working-directory: backend
        run: ./gradlew --no-daemon -q bootJar
      - name: Build before and after x86_64 debug APKs
        run: |
          BASE_SHA="${BASE_SHA:-$(git merge-base origin/main HEAD)}"
          echo "Visual baseline: $BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/kunde-before" "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/visual-apk" reports/visual
          build() (
            cd "$1/mobile"
            flutter pub get --enforce-lockfile
            flutter build apk --debug --target-platform android-x64 \
              --dart-define=API_BASE_URL=http://localhost:8081/api/v1/ \
              --dart-define=API_TIMEOUT_SECONDS=90 \
              --dart-define=PHONE_AUTH_ENABLED=true \
              --dart-define=DEV_OTP_HINT=true
            cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/visual-apk/$2.apk"
          )
          build "$RUNNER_TEMP/kunde-before" before
          build "$GITHUB_WORKSPACE" after
          (cd mobile/android && bash gradlew --stop)
          jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}' | xargs -r kill
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 1536 -cores 2
          script: python3 scripts/ci/run_android_visual.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kunde-android-visual
          path: reports/visual/
          if-no-files-found: warn
          retention-days: 14
