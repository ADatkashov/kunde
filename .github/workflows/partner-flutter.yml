name: Partner Flutter CI
on:
  push:
    branches: [main]
    paths: ['partner_app/**', 'packages/kunde_design/**', '.github/workflows/partner-flutter.yml']
  pull_request:
    paths: ['partner_app/**', 'packages/kunde_design/**', '.github/workflows/partner-flutter.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  partner-flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve, analyze and test standalone Partner
        working-directory: partner_app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
