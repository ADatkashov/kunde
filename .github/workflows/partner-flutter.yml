name: Partner Flutter CI
on:
  push:
    branches: [main]
    paths: ['apps/partner/**', 'packages/**', '.github/workflows/partner-flutter.yml']
  pull_request:
    paths: ['apps/partner/**', 'packages/**', '.github/workflows/partner-flutter.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Literal group: when called from Full Regression the four Flutter workflows share the caller's github.workflow and must not cancel each other.
  group: partner-flutter-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  partner-flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve, analyze and test standalone Partner
        working-directory: apps/partner
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
