name: Terraform DEV (Render + Neon)
on:
  pull_request:
    paths: ['infrastructure/terraform/**', 'scripts/ci/check_terraform_policy.py', '.github/workflows/terraform-dev.yml']
  push:
    branches: [main]
    paths: ['infrastructure/terraform/**', 'scripts/ci/check_terraform_policy.py', '.github/workflows/terraform-dev.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply after plan. Requires approval in the "dev" GitHub Environment.'
        type: boolean
        default: false
      confirm:
        description: 'Type apply-dev to allow an apply'
        type: string
        default: ''
permissions:
  contents: read
# One run at a time: serialises plan/apply per workflow in addition to state locking.
concurrency:
  group: terraform-dev-${{ github.event_name == 'workflow_dispatch' && 'run' || github.ref }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: validate and tests (offline, mocked providers)
        run: |
          set -e
          for m in infrastructure/terraform/modules/*/; do
            (cd "$m" && terraform init -backend=false && terraform validate && terraform test)
          done
          for e in infrastructure/terraform/environments/*/; do
            (cd "$e" && terraform init -backend=false && terraform validate)
          done
      - name: Security policy (no state/tfvars/credentials, TLS, no destroy)
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_check_terraform_policy.py'
          python3 scripts/ci/check_terraform_policy.py
          python3 scripts/ci/check_secrets.py

  plan:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-plan
    outputs:
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require configuration
        run: |
          for v in RENDER_API_KEY RENDER_OWNER_ID NEON_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is not configured in the dev-plan environment"; exit 1; }
          done
          for v in TF_STATE_BUCKET TF_STATE_ENDPOINT; do
            [ -n "${!v}" ] || { echo "::error::$v variable is not configured"; exit 1; }
          done
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
      - name: Init with protected remote state (native locking)
        working-directory: infrastructure/terraform/environments/dev
        run: |
          cat > "$RUNNER_TEMP/backend.hcl" <<HCL
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/terraform.tfstate"
          region       = "${{ vars.TF_STATE_REGION || 'auto' }}"
          use_lockfile = true
          encrypt      = true
          endpoints    = { s3 = "${{ vars.TF_STATE_ENDPOINT }}" }
          use_path_style              = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          HCL
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Plan
        id: plan
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform plan -lock-timeout=120s -out="$RUNNER_TEMP/tfplan"
          echo "plan_sha=$(terraform show -no-color "$RUNNER_TEMP/tfplan" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && inputs.confirm == 'apply-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure required reviewers on this Environment: that is the manual approval gate.
    environment: dev
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Init with protected remote state (native locking)
        working-directory: infrastructure/terraform/environments/dev
        run: |
          cat > "$RUNNER_TEMP/backend.hcl" <<HCL
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "dev/terraform.tfstate"
          region       = "${{ vars.TF_STATE_REGION || 'auto' }}"
          use_lockfile = true
          encrypt      = true
          endpoints    = { s3 = "${{ vars.TF_STATE_ENDPOINT }}" }
          use_path_style              = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          HCL
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Re-plan and require the reviewed plan
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform plan -lock-timeout=120s -out="$RUNNER_TEMP/tfplan"
          sha="$(terraform show -no-color "$RUNNER_TEMP/tfplan" | sha256sum | cut -d' ' -f1)"
          if [ "$sha" != "${{ needs.plan.outputs.plan_sha }}" ]; then
            echo "::error::Plan changed since it was reviewed; run the workflow again."
            exit 1
          fi
      - name: Apply the saved plan
        working-directory: infrastructure/terraform/environments/dev
        run: terraform apply -lock-timeout=120s "$RUNNER_TEMP/tfplan"
      - name: Smoke test (Flyway ran, DB reachable, fail-closed auth)
        working-directory: infrastructure/terraform/environments/dev
        run: |
          url="$(terraform output -raw backend_url)"
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/actuator/health/readiness" || true)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::readiness did not reach 200 (last: $code)"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/api/v1/protected-test")" = "503" ]
          curl -fsS "$url/api/v1/openapi.yaml" | grep -q 'openapi: 3.1.0'
