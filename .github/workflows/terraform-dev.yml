name: Terraform DEV (Render + Neon)
on:
  pull_request:
    paths: ['infrastructure/terraform/**', 'scripts/ci/check_terraform_policy.py', 'scripts/ci/check_terraform_plan.py', '.github/workflows/terraform-dev.yml']
  push:
    branches: [main]
    paths: ['infrastructure/terraform/**', 'scripts/ci/check_terraform_policy.py', 'scripts/ci/check_terraform_plan.py', '.github/workflows/terraform-dev.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply after plan. Requires approval in the "dev" GitHub Environment.'
        type: boolean
        default: false
      confirm:
        description: 'Type apply-dev to allow an apply'
        type: string
        default: ''
      replace_render:
        description: 'Replace (delete + create) the Render service. Needed because provider 1.9.1 cannot update free-plan services in place.'
        type: boolean
        default: false
permissions:
  contents: read
# One run at a time: serialises plan/apply per workflow in addition to state locking.
concurrency:
  group: terraform-dev-${{ github.event_name == 'workflow_dispatch' && 'run' || github.ref }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: validate and tests (offline, mocked providers)
        run: |
          set -e
          for m in infrastructure/terraform/modules/*/; do
            (cd "$m" && terraform init -backend=false && terraform validate && terraform test)
          done
          for e in infrastructure/terraform/environments/*/; do
            (cd "$e" && terraform init -backend=false && terraform validate)
          done
      - name: Security policy (no state/tfvars/credentials, TLS, no destroy)
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_check_terraform_policy.py'
          python3 scripts/ci/check_terraform_policy.py
          python3 scripts/ci/check_secrets.py
          python3 -m unittest discover -s scripts/ci -p 'test_check_terraform_plan.py'

  plan:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Plan-only environment: the workflow has no apply step in this job.
    environment: dev-plan
    outputs:
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_auth_phone_enabled: ${{ vars.AUTH_PHONE_ENABLED || 'false' }}
      TF_VAR_auth_dev_otp_enabled: ${{ vars.AUTH_DEV_OTP_ENABLED || 'false' }}
      TF_VAR_auth_phone_secret: ${{ secrets.AUTH_PHONE_SECRET }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      REPLACE_RENDER: ${{ inputs.replace_render && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require configuration (values are never printed)
        run: |
          missing=0
          for v in RENDER_API_KEY RENDER_OWNER_ID NEON_API_KEY TF_VAR_neon_org_id TF_TOKEN_app_terraform_io TF_CLOUD_ORGANIZATION TF_WORKSPACE; do
            if [ -z "${!v}" ]; then echo "::error::$v is not configured in this GitHub Environment"; missing=1; fi
          done
          # Phone sign-in settings: only lengths/flags are checked, the secret is never printed.
          if [ "$TF_VAR_auth_phone_enabled" = "true" ] && [ "${#TF_VAR_auth_phone_secret}" -lt 32 ]; then
            echo "::error::AUTH_PHONE_ENABLED=true needs environment secret AUTH_PHONE_SECRET (32+ characters) in this Environment"; missing=1
          fi
          if [ "$TF_VAR_auth_dev_otp_enabled" = "true" ] && [ "$TF_VAR_auth_phone_enabled" != "true" ]; then
            echo "::error::AUTH_DEV_OTP_ENABLED=true requires AUTH_PHONE_ENABLED=true"; missing=1
          fi
          exit $missing
      - name: Init (HCP Terraform state, locked during runs)
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init
      - name: Plan
        id: plan
        working-directory: infrastructure/terraform/environments/dev
        run: |
          args=""
          if [ "$REPLACE_RENDER" = "true" ]; then args="-replace=module.backend.render_web_service.this"; fi
          terraform plan -lock-timeout=120s $args -out="$RUNNER_TEMP/tfplan"
          terraform show -no-color "$RUNNER_TEMP/tfplan"
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          echo "plan_sha=$(terraform show -no-color "$RUNNER_TEMP/tfplan" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cost and safety gate (free tier only, no deletes)
        run: python3 scripts/ci/check_terraform_plan.py "$RUNNER_TEMP/plan.json"
        env:
          ALLOW_RENDER_REPLACE: ${{ inputs.replace_render && 'true' || 'false' }}

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && inputs.confirm == 'apply-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Add required reviewers to this Environment: that is the manual approval gate.
    environment: dev
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_auth_phone_enabled: ${{ vars.AUTH_PHONE_ENABLED || 'false' }}
      TF_VAR_auth_dev_otp_enabled: ${{ vars.AUTH_DEV_OTP_ENABLED || 'false' }}
      TF_VAR_auth_phone_secret: ${{ secrets.AUTH_PHONE_SECRET }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      REPLACE_RENDER: ${{ inputs.replace_render && 'true' || 'false' }}
      TF_APPLY_ENABLED: ${{ vars.TF_APPLY_ENABLED }}
    steps:
      - name: Explicit apply switch (compensating control if reviewers are not configured)
        run: |
          [ "$TF_APPLY_ENABLED" = "true" ] || { echo "::error::Set variable TF_APPLY_ENABLED=true in the dev Environment to allow apply"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform (checksum verified)
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
          echo "1eaed12ca41fcfe094da3d76a7e9aa0639ad3409c43be0103ee9f5a1ff4b7437  tf.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require configuration (values are never printed)
        run: |
          missing=0
          for v in RENDER_API_KEY RENDER_OWNER_ID NEON_API_KEY TF_VAR_neon_org_id TF_TOKEN_app_terraform_io TF_CLOUD_ORGANIZATION TF_WORKSPACE; do
            if [ -z "${!v}" ]; then echo "::error::$v is not configured in this GitHub Environment"; missing=1; fi
          done
          # Phone sign-in settings: only lengths/flags are checked, the secret is never printed.
          if [ "$TF_VAR_auth_phone_enabled" = "true" ] && [ "${#TF_VAR_auth_phone_secret}" -lt 32 ]; then
            echo "::error::AUTH_PHONE_ENABLED=true needs environment secret AUTH_PHONE_SECRET (32+ characters) in this Environment"; missing=1
          fi
          if [ "$TF_VAR_auth_dev_otp_enabled" = "true" ] && [ "$TF_VAR_auth_phone_enabled" != "true" ]; then
            echo "::error::AUTH_DEV_OTP_ENABLED=true requires AUTH_PHONE_ENABLED=true"; missing=1
          fi
          exit $missing
      - name: Init
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init
      - name: Re-plan and require the reviewed plan
        working-directory: infrastructure/terraform/environments/dev
        run: |
          args=""
          if [ "$REPLACE_RENDER" = "true" ]; then args="-replace=module.backend.render_web_service.this"; fi
          terraform plan -lock-timeout=120s $args -out="$RUNNER_TEMP/tfplan"
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          ALLOW_RENDER_REPLACE="$REPLACE_RENDER" python3 "$GITHUB_WORKSPACE/scripts/ci/check_terraform_plan.py" "$RUNNER_TEMP/plan.json"
          sha="$(terraform show -no-color "$RUNNER_TEMP/tfplan" | sha256sum | cut -d' ' -f1)"
          if [ "$sha" != "${{ needs.plan.outputs.plan_sha }}" ]; then
            echo "::error::Plan changed since it was reviewed; run the workflow again."
            exit 1
          fi
      - name: Apply the saved plan
        working-directory: infrastructure/terraform/environments/dev
        run: terraform apply -lock-timeout=120s "$RUNNER_TEMP/tfplan"
      - name: Smoke test (Flyway ran, DB reachable, fail-closed auth)
        working-directory: infrastructure/terraform/environments/dev
        run: |
          url="$(terraform output -raw backend_url)"
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/actuator/health/readiness" || true)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::readiness did not reach 200 (last: $code)"; exit 1; }
          # Protected routes stay closed: 503 while no identity is configured, 401 once phone sign-in is on.
          expected=503; [ "$TF_VAR_auth_phone_enabled" = "true" ] && expected=401
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/api/v1/protected-test")" = "$expected" ]
          if [ "$TF_VAR_auth_phone_enabled" = "true" ]; then
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"bad"}' "$url/api/v1/auth/otp/request")" = "400" ]
          fi
          curl -fsS "$url/api/v1/openapi.yaml" | grep -q 'openapi: 3.1.0'
