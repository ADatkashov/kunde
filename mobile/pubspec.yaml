name: kunde_mobile
description: KUNDE Super App consumer experience
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  kunde_design:
    path: ../packages/kunde_design
  kunde_api:
    path: ../packages/kunde_api
  kunde_auth:
    path: ../packages/kunde_auth
  kunde_localization:
    path: ../packages/kunde_localization
  kunde_maps:
    path: ../packages/kunde_maps
  kunde_models:
    path: ../packages/kunde_models
  kunde_operator:
    path: ../packages/kunde_operator
  kunde_ui:
    path: ../packages/kunde_ui
  kunde_maps_sdk:
    # KUNDE Maps SDK 0.2.1, pinned to the immutable release commit of kunde-maps (release tags cannot be created from CI-less agent sessions).
    git:
      url: https://github.com/ADatkashov/kunde-maps.git
      path: packages/kunde_maps_sdk
      ref: 3a6134736d27e073e8d98e878a0ffc5c5bf375b8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_appauth: 13.0.0
  flutter_secure_storage: 11.2.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/photos/
    - assets/fonts/LICENSE.txt
  fonts:
    - family: KundeSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSans-Black.ttf
          weight: 900
