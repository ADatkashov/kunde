name: kunde_mobile
description: KUNDE Super App consumer experience
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  kunde_maps_sdk:
    git:
      url: https://github.com/ADatkashov/kunde-maps.git
      ref: 59e8ff44cd55672732ad91e6ba33fd79d91d1f66
      path: packages/kunde_maps_sdk
  kunde_design:
    path: ../packages/kunde_design
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_appauth: 13.0.0
  flutter_secure_storage: 11.2.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/photos/
    - assets/fonts/LICENSE.txt
  fonts:
    - family: KundeSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSans-Black.ttf
          weight: 900
