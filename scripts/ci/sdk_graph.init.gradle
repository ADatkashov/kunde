import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('kundeSdkGraph') {
        doLast {
            def modules = [:]
            def paths = [:].withDefault { [] }
            def collect = { configuration, label ->
                if (configuration == null || !configuration.canBeResolved) return
                def result = configuration.incoming.resolutionResult
                if (result.allDependencies.any { it instanceof UnresolvedDependencyResult }) throw new GradleException('Incomplete SDK graph')
                def queue = new java.util.ArrayDeque()
                def seen = [] as Set
                queue.add([result.rootComponent.get(), []])
                while (!queue.isEmpty()) {
                    def entry = queue.remove()
                    def component = entry[0]
                    def id = component.id
                    def name = id instanceof ModuleComponentIdentifier ? id.group+':'+id.module+':'+id.version : id.displayName
                    if (!seen.add(name)) continue
                    def path = entry[1]+[name]
                    if (id instanceof ModuleComponentIdentifier) {
                        def labels = modules[name]?.configurations ?: []
                        modules[name] = [groupId:id.group, artifactId:id.module, version:id.version, configurations:(labels+[label]).unique()]
                        paths[name].add([configuration:label, dependencyPath:path])
                    }
                    component.dependencies.each { dependency -> if (!(dependency instanceof UnresolvedDependencyResult)) queue.add([dependency.selected,path]) }
                }
            }
            collect(root.buildscript.configurations.findByName('classpath'),'flutter-sdk:buildscript')
            ['compileClasspath','runtimeClasspath'].each { collect(root.configurations.findByName(it),'flutter-sdk:'+it) }
            if (modules.isEmpty()) throw new GradleException('Empty SDK graph')
            def output = new File(System.getenv('KUNDE_SDK_GRAPH'))
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([groupId:'private.kunde',artifactId:'unmodified-flutter-sdk',version:'3.47.0',
                children:modules.sort().values().toList(),contexts:paths,pathPolicy:'one shortest path per configuration']))+'\n'
            println('FLUTTER_SDK_GRAPH modules='+modules.size()+' kotlin='+modules.values().findAll { it.artifactId=='kotlin-gradle-plugin' })
        }
    }
}
