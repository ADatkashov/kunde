spring:
  application:
    name: kunde-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kunde}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  http:
    converters:
      preferred-json-mapper: jackson2
  jackson2:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  forward-headers-strategy: none
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring.lifecycle.timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
app:
  identity:
    consumer-enabled: ${CONSUMER_IDENTITY_ENABLED:false}
  security:
    max-body-bytes: ${API_MAX_BODY_BYTES:65536}
    rate-limit:
      requests: ${API_RATE_LIMIT_REQUESTS:120}
      window-seconds: ${API_RATE_LIMIT_WINDOW_SECONDS:60}
      max-clients: ${API_RATE_LIMIT_MAX_CLIENTS:4096}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      audience: ${OIDC_AUDIENCE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
logging:
  structured:
    format:
      console: logstash
  pattern:
    correlation: "[%X{correlationId:-}] "
