openapi: 3.1.0
info:
  title: KUNDE Foundation API
  version: 1.0.0
  description: Foundation endpoints only. Public marketplace and authentication flows are not enabled.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '200':
          description: API process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: kunde-api }
  /capabilities:
    get:
      operationId: getPlatformCapabilities
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Enabled platform capabilities; does not expose secrets or operational details.
          content:
            application/json:
              schema:
                type: object
                required: [releaseStage, marketplaceEnabled, oidcIssuerConfigured, aiEnabled]
                properties:
                  releaseStage: { type: string, example: FOUNDATION }
                  marketplaceEnabled: { type: boolean, example: false }
                  oidcIssuerConfigured: { type: boolean, example: false }
                  aiEnabled: { type: boolean, example: false }
  /categories:
    get:
      operationId: listAvailableCategories
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Available categories. Empty until an approved catalog is implemented and configured.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /search:
    get:
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Search results; empty until an approved catalog is implemented.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
components:
  responses:
    RequestBodyTooLarge:
      description: API request body exceeds the configured byte limit (65536 bytes by default). Applies to declared and streamed bodies before parsing or controller execution.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Per-process peer-IP or verified issuer/subject quota exhausted, or its bounded table is full. Token rotation does not reset an identity budget. Retry after the indicated delay; health probes remain available.
      headers:
        Retry-After:
          description: Positive delay in seconds, rounded up to the next available window.
          schema: { type: integer, minimum: 1 }
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, code, message, path, correlationId]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
