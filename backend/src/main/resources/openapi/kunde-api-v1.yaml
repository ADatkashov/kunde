openapi: 3.1.0
info:
  title: KUNDE Foundation API
  version: 1.0.0
  description: Foundation endpoints only. Public marketplace and authentication flows are not enabled.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '200':
          description: API process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: kunde-api }
  /capabilities:
    get:
      operationId: getPlatformCapabilities
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Enabled platform capabilities; does not expose secrets or operational details.
          content:
            application/json:
              schema:
                type: object
                required: [releaseStage, marketplaceEnabled, oidcIssuerConfigured, aiEnabled]
                properties:
                  releaseStage: { type: string, example: FOUNDATION }
                  marketplaceEnabled: { type: boolean, example: false }
                  oidcIssuerConfigured: { type: boolean, example: false }
                  aiEnabled: { type: boolean, example: false }
  /rides:
    post:
      operationId: createRide
      description: Create a request from an unexpired server-issued quote owned by the caller. Reusing a key with the same quote returns the original ride.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/RideReturned' }
        '201': { $ref: '#/components/responses/RideReturned' }
        '400': { description: Invalid request or key }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: New rides unavailable }
        '409': { description: Quote unavailable, key reused with a different quote, or ride already pending }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listMyRides
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Caller-owned ride requests, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideRequest' }
        '400': { description: Invalid pagination }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      operationId: getMyRide
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/RideReturned' }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: Ride not found for caller }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rides/{rideId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      operationId: cancelMyRide
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/RideReturned' }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: Ride not found for caller }
        '409': { description: Ride can no longer be cancelled }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rides/{rideId}/dispatch:
    parameters:
      - name: rideId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: searchForRideDriver
      security:
        - bearerAuth: []
      responses:
        '200': { description: Ride status after advancing dispatch }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /rides/{rideId}/location:
    parameters:
      - name: rideId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssignedDriverLocation
      security:
        - bearerAuth: []
      responses:
        '200': { description: Latest permitted driver position }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '204': { description: No fresh location available for this trip }
  /executor/rides/profile:
    get:
      operationId: getRideDriverProfile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Authenticated driver profile and vehicle }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
    post:
      operationId: registerRideDriver
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver profile pending review }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /executor/rides/vehicle:
    post:
      operationId: registerRideVehicle
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver profile with pending vehicle }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /executor/rides/availability:
    put:
      operationId: updateRideDriverAvailability
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver profile with current availability }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /executor/rides/location:
    put:
      operationId: reportRideDriverLocation
      security:
        - bearerAuth: []
      responses:
        '204': { description: Position accepted }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /executor/rides/offers:
    get:
      operationId: listRideOffers
      security:
        - bearerAuth: []
      responses:
        '200': { description: Unexpired offers for the authenticated driver }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
  /executor/rides/offers/{offerId}/response:
    parameters:
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: respondToRideOffer
      security:
        - bearerAuth: []
      responses:
        '204': { description: Offer response recorded }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /executor/rides/trips:
    get:
      operationId: listExecutorRides
      security:
        - bearerAuth: []
      responses:
        '200': { description: Trips assigned to the authenticated driver }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
  /executor/rides/trips/{rideId}/progress:
    parameters:
      - name: rideId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: advanceExecutorRide
      security:
        - bearerAuth: []
      responses:
        '204': { description: Assigned trip advanced }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /admin/rides/drivers:
    get:
      operationId: listRideDriversForReview
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver identifiers pending review }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
  /admin/rides/drivers/{driverId}:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRideDriverForReview
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver and vehicle details }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
  /admin/rides/drivers/{driverId}/decision:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decideRideDriverReview
      security:
        - bearerAuth: []
      responses:
        '200': { description: Updated vehicle or driver status }
        '401': { description: Authentication required }
        '403': { description: Insufficient permissions }
        '404': { description: Resource or feature unavailable }
        '409': { description: Operation conflicts with the resource state }
  /rides/quotes:
    post:
      operationId: issueRideQuote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rideClass, pickup, destination]
              properties:
                rideClass: { type: string, enum: [ECONOMY, COMFORT, BUSINESS] }
                pickup: { $ref: '#/components/schemas/RidePoint' }
                destination: { $ref: '#/components/schemas/RidePoint' }
      responses:
        '201':
          description: Server-priced quote scoped to the authenticated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideQuote' }
        '400': { description: Invalid quote request }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: New rides unavailable }
        '422': { description: Tariff unavailable or route cannot be quoted }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Routing adapter unavailable }
  /rides/address-search:
    post:
      operationId: searchRideAddresses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, language]
              properties:
                query: { type: string, minLength: 2, maxLength: 160 }
                language: { $ref: '#/components/schemas/RideLanguage' }
      responses:
        '200':
          description: Matching addresses returned by the routing adapter.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RidePlace' }
        '400': { description: Invalid query or language }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: Rides unavailable }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Routing adapter unavailable }
  /rides/reverse-geocode:
    post:
      operationId: reverseGeocodeRidePoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coordinates, language]
              properties:
                coordinates: { $ref: '#/components/schemas/RidePoint' }
                language: { $ref: '#/components/schemas/RideLanguage' }
      responses:
        '200':
          description: Address returned by the routing adapter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePlace' }
        '400': { description: Invalid coordinates or language }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: Rides unavailable or address not found }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Routing adapter unavailable }
  /rides/route-preview:
    post:
      operationId: previewRideRoute
      description: Road route for an authenticated consumer. Requires internal Rides and Consumer flags and a configured routing adapter.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, destination]
              properties:
                pickup: { $ref: '#/components/schemas/RidePoint' }
                destination: { $ref: '#/components/schemas/RidePoint' }
      responses:
        '200':
          description: Road route returned by the configured adapter. Response is not cached.
          content:
            application/json:
              schema:
                type: object
                required: [distanceMeters, durationSeconds, geometry]
                properties:
                  distanceMeters: { type: integer, minimum: 1 }
                  durationSeconds: { type: integer, minimum: 1 }
                  geometry:
                    type: array
                    minItems: 2
                    items: { $ref: '#/components/schemas/RidePoint' }
        '400': { description: Invalid request coordinates }
        '401': { description: Authentication required }
        '403': { description: Consumer access denied }
        '404': { description: Rides unavailable }
        '422': { description: No road route found }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Routing adapter unavailable }
  /categories:
    get:
      operationId: listAvailableCategories
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Available categories. Published categories only; empty until a catalog is approved and published.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /categories/{categoryId}/offerings:
    get:
      operationId: listCategoryOfferings
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: PUBLISHED offerings of a PUBLISHED category (id, categoryId, kind, RU/KK/EN names). Empty for unknown, unpublished or retired categories. No price, partner or availability is exposed.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /offerings/{offeringId}:
    get:
      operationId: getOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: Offering is unknown, not PUBLISHED, or its category is not PUBLISHED (not distinguishable).
        '200':
          description: One PUBLISHED offering (id, categoryId, kind, RU/KK/EN names, partnerId, partnerName of its APPROVED partner). No price or availability.
          content:
            application/json:
              schema: { type: object }
  /partners/{partnerId}:
    get:
      operationId: getPartner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: Partner is unknown or not APPROVED (not distinguishable).
        '200':
          description: Public view of an APPROVED partner (id, displayName). No staff, status history, contacts or documents.
          content:
            application/json:
              schema: { type: object }
  /search:
    get:
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Published categories matching q (RU/KK/EN names, case-insensitive; exact, prefix, then substring ranking). Empty for blank q or until a catalog is published.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /food/restaurants:
    get:
      operationId: listFoodRestaurants
      description: KUNDE Food DEV pilot (only when app.food.enabled; absent otherwise). Synthetic demo restaurants.
      parameters:
        - { name: vertical, in: query, schema: { type: string, enum: [FOOD, GROCERY, FLOWERS_GIFTS], default: FOOD } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Restaurants (id, slug, name, cuisine, description, emoji, tone, deliveryFeeMinor, minOrderMinor, eta range, open, synthetic). Money is integer KZT minor units.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /food/restaurants/{restaurantId}:
    get:
      operationId: getFoodRestaurant
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '404':
          description: RESTAURANT_NOT_FOUND.
        '200':
          description: Restaurant with menu sections, dishes and option groups.
          content:
            application/json:
              schema: { type: object }
  /food/search:
    get:
      operationId: searchFood
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: vertical, in: query, schema: { type: string, enum: [FOOD, GROCERY, FLOWERS_GIFTS], default: FOOD } }
      responses:
        '200':
          description: Restaurants and dishes matching q (case-insensitive substring). Empty for blank q.
          content:
            application/json:
              schema: { type: object }
  /food/cart/quote:
    post:
      operationId: quoteFoodCart
      description: Authenticated. Server-side pricing; the client sends only dish and option ids, never prices.
      responses:
        '200':
          description: Priced lines, subtotal, delivery fee and total.
          content:
            application/json:
              schema: { type: object }
        '409':
          description: RESTAURANT_CLOSED.
        '422':
          description: FOOD_ITEM_UNAVAILABLE, FOOD_OPTIONS_INVALID, FOOD_MIN_ORDER_NOT_MET or FOOD_CART_TOO_LARGE.
  /food/orders:
    get:
      operationId: listFoodOrders
      description: Authenticated. The caller's own orders, newest first; mock fulfillment advances on read.
      responses:
        '200':
          description: Orders with items and status timeline.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    post:
      operationId: placeFoodOrder
      description: >-
        Authenticated; requires an Idempotency-Key header (16-64 chars). Food and Grocery retain
        their DEV payment methods. FLOWERS_GIFTS requires DEV_NO_PAYMENT and expectedTotalMinor
        from the current quote, plus an approved linked partner. The server recalculates the
        total and returns FOOD_PRICE_CHANGED (409) if it differs; paymentStatus is NO_PAYMENT.
        The partner controls order status. No real payment or delivery takes place.
      responses:
        '201':
          description: Order created (status PLACED).
        '200':
          description: Idempotent replay of the same key and restaurant.
        '400':
          description: IDEMPOTENCY_KEY_INVALID or validation failure.
        '409':
          description: IDEMPOTENCY_KEY_REUSED, TOO_MANY_ACTIVE_ORDERS or FOOD_PRICE_CHANGED.
        '422':
          description: PAYMENT_METHOD_UNSUPPORTED, FLOWERS_ORDER_UNAVAILABLE, ADDRESS_NOT_FOUND or a quote error.
  /food/orders/{orderId}:
    get:
      operationId: getFoodOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '404':
          description: ORDER_NOT_FOUND (also for another user's order).
        '200':
          description: One order of the caller.
  /food/orders/{orderId}/cancel:
    post:
      operationId: cancelFoodOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '409':
          description: ORDER_NOT_CANCELLABLE once the restaurant accepted the order (D-06).
        '200':
          description: Order cancelled (only while PLACED); NO_PAYMENT remains unchanged for DEV_NO_PAYMENT.
  /food/orders/{orderId}/repeat:
    get:
      operationId: repeatFoodOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Items of the past order that can still be ordered, plus names of skipped items.
  /booking/venues:
    get:
      operationId: listBookingVenues
      description: Barbershop booking DEV pilot (only when app.booking.enabled; absent otherwise). Synthetic venues.
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [BARBER, CLEANING], default: BARBER } }
      responses:
        '200':
          description: Venues (id, slug, category, name, address, emoji, open, synthetic, fromPriceMinor).
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /booking/venues/{venueId}:
    get:
      operationId: getBookingVenue
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '404':
          description: VENUE_NOT_FOUND.
        '200':
          description: Venue with services (duration, KZT price) and masters (with the service ids they perform).
  /booking/slots:
    get:
      operationId: listBookingSlots
      description: Free start times (15-minute grid inside working hours, outside breaks, 30 min lead, 14-day horizon) for one master or any master.
      parameters:
        - { name: venueId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: serviceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: masterId, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Slots (startsAt with venue offset, masterId, masterName).
        '400':
          description: BOOKING_DATE_INVALID.
        '404':
          description: VENUE_NOT_FOUND, SERVICE_NOT_FOUND or MASTER_NOT_FOUND.
  /booking/bookings:
    get:
      operationId: listBookings
      description: Authenticated. The caller's own bookings, newest start first; past confirmed bookings become COMPLETED.
      responses:
        '200':
          description: Bookings.
    post:
      operationId: createBooking
      description: Authenticated. Requires Idempotency-Key. Only a slot offered by /booking/slots can be booked. Confirmation is a DEV mock; payment is on site.
      responses:
        '201':
          description: Booking confirmed (confirmation DEV_MOCK).
        '200':
          description: Idempotent replay.
        '409':
          description: SLOT_UNAVAILABLE, SLOT_TAKEN (database exclusion on overlapping time of one master), BOOKING_OVERLAPS_YOURS, TOO_MANY_UPCOMING_BOOKINGS or IDEMPOTENCY_KEY_REUSED.
  /booking/bookings/{id}:
    get:
      operationId: getBooking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '404':
          description: BOOKING_NOT_FOUND (also for another user's booking).
        '200':
          description: One booking of the caller.
  /booking/bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '409':
          description: BOOKING_NOT_CANCELLABLE (already cancelled, completed or started).
        '200':
          description: Cancelled; free until the appointment starts.
components:
  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    RideReturned:
      description: Current state of the caller-owned ride request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RideRequest' }
    RequestBodyTooLarge:
      description: API request body exceeds the configured byte limit (65536 bytes by default). Applies to declared and streamed bodies before parsing or controller execution.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Per-process peer-IP or verified issuer/subject quota exhausted, or its bounded table is full. Token rotation does not reset an identity budget. Retry after the indicated delay; health probes remain available.
      headers:
        Retry-After:
          description: Positive delay in seconds, rounded up to the next available window.
          schema: { type: integer, minimum: 1 }
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    RideQuote:
      type: object
      required: [id, rideClass, tariffVersion, estimateKzt, currency, distanceMeters, durationSeconds, expiresAt]
      properties:
        id: { type: string, format: uuid }
        rideClass: { type: string, enum: [ECONOMY, COMFORT, BUSINESS] }
        tariffVersion: { type: string }
        estimateKzt: { type: number, minimum: 0 }
        currency: { const: KZT }
        synthetic: { type: boolean, description: Internal synthetic routing fixture }
        distanceMeters: { type: integer, minimum: 1 }
        durationSeconds: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    RideRequest:
      type: object
      required: [id, quoteId, status, rideClass, tariffVersion, estimateKzt, currency, distanceMeters, durationSeconds, createdAt]
      properties:
        id: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVING, DRIVER_ARRIVED, IN_PROGRESS,
                 COMPLETED, CANCELLED_BY_CUSTOMER, CANCELLED_BY_DRIVER, CANCELLED_BY_SYSTEM, NO_DRIVER_AVAILABLE, FAILED]
        rideClass: { type: string, enum: [ECONOMY, COMFORT, BUSINESS] }
        tariffVersion: { type: string }
        estimateKzt: { type: number, minimum: 0 }
        currency: { const: KZT }
        synthetic: { type: boolean, description: Internal synthetic routing fixture }
        distanceMeters: { type: integer, minimum: 1 }
        durationSeconds: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    RideLanguage:
      type: string
      enum: [ru, kk, en]
    RidePlace:
      type: object
      required: [address, point]
      properties:
        address: { type: string }
        point: { $ref: '#/components/schemas/RidePoint' }
    RidePoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    ApiError:
      type: object
      required: [timestamp, status, code, message, path, correlationId]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
