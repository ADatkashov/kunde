openapi: 3.1.0
info:
  title: KUNDE Foundation API
  version: 1.0.0
  description: Foundation endpoints only. Public marketplace and authentication flows are not enabled.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '200':
          description: API process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: kunde-api }
  /capabilities:
    get:
      operationId: getPlatformCapabilities
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Enabled platform capabilities; does not expose secrets or operational details.
          content:
            application/json:
              schema:
                type: object
                required: [releaseStage, marketplaceEnabled, oidcIssuerConfigured, aiEnabled]
                properties:
                  releaseStage: { type: string, example: FOUNDATION }
                  marketplaceEnabled: { type: boolean, example: false }
                  oidcIssuerConfigured: { type: boolean, example: false }
                  aiEnabled: { type: boolean, example: false }
  /categories:
    get:
      operationId: listAvailableCategories
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Available categories. Published categories only; empty until a catalog is approved and published.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /categories/{categoryId}/offerings:
    get:
      operationId: listCategoryOfferings
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: PUBLISHED offerings of a PUBLISHED category (id, categoryId, kind, RU/KK/EN names). Empty for unknown, unpublished or retired categories. No price, partner or availability is exposed.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /offerings/{offeringId}:
    get:
      operationId: getOffering
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: Offering is unknown, not PUBLISHED, or its category is not PUBLISHED (not distinguishable).
        '200':
          description: One PUBLISHED offering (id, categoryId, kind, RU/KK/EN names, partnerId, partnerName of its APPROVED partner). No price or availability.
          content:
            application/json:
              schema: { type: object }
  /partners/{partnerId}:
    get:
      operationId: getPartner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: Partner is unknown or not APPROVED (not distinguishable).
        '200':
          description: Public view of an APPROVED partner (id, displayName). No staff, status history, contacts or documents.
          content:
            application/json:
              schema: { type: object }
  /search:
    get:
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Published categories matching q (RU/KK/EN names, case-insensitive; exact, prefix, then substring ranking). Empty for blank q or until a catalog is published.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
components:
  responses:
    RequestBodyTooLarge:
      description: API request body exceeds the configured byte limit (65536 bytes by default). Applies to declared and streamed bodies before parsing or controller execution.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Per-process peer-IP or verified issuer/subject quota exhausted, or its bounded table is full. Token rotation does not reset an identity budget. Retry after the indicated delay; health probes remain available.
      headers:
        Retry-After:
          description: Positive delay in seconds, rounded up to the next available window.
          schema: { type: integer, minimum: 1 }
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, code, message, path, correlationId]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
