name: kunde-identity-poc-backend-db
services:
  database:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: kunde_identity_poc
      POSTGRES_USER: kunde_poc
      POSTGRES_PASSWORD: ${POC_DB_PASSWORD:?Run Start-BackendPoc.ps1 to generate local password}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - backend-poc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kunde_poc -d kunde_identity_poc"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  backend-poc-db:
