services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kunde
      POSTGRES_USER: ${DB_USERNAME:?Create a local .env with DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create a local .env with DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kunde-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/kunde
      DB_USERNAME: ${DB_USERNAME:?Create a local .env with DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Create a local .env with DB_PASSWORD}
      PORT: 8080
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: build
    command: ["mvn", "--batch-mode", "--no-transfer-progress", "verify"]
    environment:
      DB_URL: jdbc:postgresql://database:5432/kunde
      DB_USERNAME: ${DB_USERNAME:?Create a local .env with DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Create a local .env with DB_PASSWORD}
      OIDC_ISSUER_URI: ""
    depends_on:
      database:
        condition: service_healthy
volumes:
  kunde-postgres:
